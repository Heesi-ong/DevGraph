# 정적 파일(SPA)과 /api reverse proxy. TLS는 앞단(호스팅 edge/로드밸런서)이 끝낸다고 가정한다.
# 보안 헤더는 정적 응답에만 붙인다 — /api 응답의 헤더는 백엔드(Spring Security)가 이미 붙이므로 중복을 피한다.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;   # 본문 상한(설계서 §17.5)보다 약간 크게. 큰 요청은 앞에서 끊는다.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;   # index.html은 항상 재검증, 해시된 /assets는 아래에서 장기 캐시
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # 클라이언트가 보낸 X-Forwarded-For는 버리고 nginx가 본 주소만 전달한다(IP 위조로 rate limit/감사 로그를 속이지 못하게).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # 프로브는 내부 네트워크용이다. 외부에는 liveness만 연다(상세 없음).
    location = /actuator/health/liveness {
        proxy_pass http://backend:8080;
    }
}
