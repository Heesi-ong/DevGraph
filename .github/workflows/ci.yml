name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # §20.1 Repository/Integration: Testcontainers로 실제 PostgreSQL을 띄운다.
      # GitHub-hosted ubuntu 러너는 Docker가 기본 탑재되어 있어 별도 설정이 필요 없다.
      - name: Build & Test
        working-directory: backend
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit test
        working-directory: frontend
        run: npm run test
      - name: Typecheck & Build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devgraph_e2e
          POSTGRES_USER: devgraph
          POSTGRES_PASSWORD: devgraph-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devgraph -d devgraph_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/devgraph_e2e
      DB_USERNAME: devgraph
      DB_PASSWORD: devgraph-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Authenticated browser E2E
        run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
