plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devgraph'
version = '0.0.1-SNAPSHOT'
description = 'DevGraph backend (package-by-feature modular monolith, design doc v1.4)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// NFR-03 dependency critical 0: Trivy가 Spring Boot 4.1.1 BOM이 관리하는 아래 버전에서 CRITICAL/HIGH를 보고했다.
// Boot가 패치 버전을 담은 릴리스로 올라가면 이 override는 지운다(docs/NFR_REPORT.md).
ext['tomcat.version'] = '11.0.26'
ext['jackson-bom.version'] = '3.1.7'
ext['jackson-2-bom.version'] = '2.21.7'

dependencies {
	// Redis, WebSocket, S3는 설계서 §0/§18.2/§25에서 명시적으로 제외한 항목이라 의존성에 넣지 않는다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Argon2PasswordEncoder(§17.2)가 런타임에 BouncyCastle을 요구한다. 컴파일 타임에는 드러나지 않는다.
	implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	// §20.1 Repository/Integration: Testcontainers PostgreSQL. H2 대체 금지.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
	testImplementation 'org.testcontainers:postgresql:1.21.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Docker 없는 환경에서 외부 PostgreSQL을 쓰기 위한 통로(AbstractIntegrationTest 참고).
	['devgraph.test.jdbc-url', 'devgraph.test.jdbc-user', 'devgraph.test.jdbc-password'].each { key ->
		System.getProperty(key)?.with { systemProperty key, it }
	}
}
